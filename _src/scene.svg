<svg class="desk scene" viewBox="0 45 2000 1423" role="img" aria-labelledby="desk-t">
<title id="desk-t">Illustration: Janet at her desk, chin in her hands, smiling. Behind her, the Golden Gate Bridge through the window; on the wall her six projects pinned to a board and tied with string; on the desk her laptop looking up a word, the Clay and Granola teardowns, a coffee and a letter.</title>
<defs>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"/></filter>
  <mask id="spot-m" maskUnits="userSpaceOnUse" x="0" y="45" width="2000" height="1423">
    <rect x="0" y="45" width="2000" height="1423" fill="#fff"/>
    <rect class="spot-hole" x="0" y="0" width="0" height="0" rx="60" fill="#000" filter="url(#soft)"/>
    <ellipse cx="885" cy="860" rx="215" ry="330" fill="#000" filter="url(#soft)"/>
  </mask>
</defs>
<image href="ASSET/janet-desk.webp" x="0" y="45" width="2000" height="1423" preserveAspectRatio="none"/>

<!-- corrections on top of the generated picture: the board's words, a book spine, and a live laptop screen -->
<g class="fix" font-family="Fraunces, Georgia, serif" text-anchor="middle" fill="#1c1818">
  <g class="cards">
    <rect x="213" y="193" width="116" height="42" fill="#f5efe8"/><text x="271" y="224" font-size="27">Speak</text>
    <rect x="456" y="193" width="118" height="42" fill="#f5efe8"/><text x="515" y="224" font-size="27">Dig</text>
    <rect x="268" y="304" width="126" height="42" fill="#f5efe8"/><text x="331" y="335" font-size="27">LexiAI</text>
    <rect x="474" y="304" width="142" height="42" fill="#f5efe8"/><text x="545" y="335" font-size="27">Research</text>
    <rect x="213" y="414" width="116" height="42" fill="#f5efe8"/><text x="271" y="445" font-size="27">Write</text>
    <rect x="456" y="414" width="118" height="42" fill="#f5efe8"/><text x="515" y="445" font-size="27">Terms</text>
  </g>
  <rect x="462" y="1143" width="198" height="38" fill="#cc836f"/><text class="sp2" x="560" y="1173" font-size="29">Granola</text>
  <g class="screen" text-anchor="start">
    <rect x="1236" y="880" width="386" height="210" fill="#fbfbfa"/>
    <text class="hw" x="1254" y="948" font-size="50" font-style="italic">lifelong</text>
    <text class="pr" x="1254" y="992" font-size="25">/ˈlaɪf.lɒŋ/ · adjective</text>
    <path d="M1254 1032H1584M1254 1058H1538M1254 1082H1464" stroke="#1c1818" stroke-width="5" stroke-linecap="round"/>
  </g>
</g>

<!-- the spotlight: a menu item lights its thing, the rest of the room steps back (assets/v5.js) -->
<rect class="spot" x="0" y="45" width="2000" height="1423" mask="url(#spot-m)"/>

<!-- her speech bubble -->
<g class="bubble" aria-hidden="true" data-x1="700" data-y0="560" data-y1="640" data-ty="618"><path class="bb" d=""/><text class="bt" x="0" y="0"></text></g>
</svg>
