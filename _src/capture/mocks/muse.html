<!doctype html>
<!-- Mock-up of the nightly Meta Muse review (Muse runs in Meta's own app, so it can't be captured here).
     Words, definition and the 9:14 pm time come from the frozen notebook data the site already uses. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 880px; height: 660px; overflow: hidden; background: #F6F5F2; color: #1C1B19;
    font: 17px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .top { height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 32px; background: #FFF; border-bottom: 1px solid #ECEAE5; }
  .av { width: 34px; height: 34px; border-radius: 50%; background: conic-gradient(from 200deg, #6E8BFF, #B07CFF, #FF8FB1, #6E8BFF); }
  .top b { font-weight: 600; } .top span { color: #7A766F; font-size: 14px; margin-left: auto; }
  .thread { padding: 28px 56px; display: flex; flex-direction: column; gap: 14px; }
  .time { align-self: center; font-size: 13px; color: #8A867E; margin-bottom: 4px; }
  .m { max-width: 74%; padding: 12px 16px; border-radius: 20px; background: #FFF; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .me { align-self: flex-end; background: #1F6FEB; color: #FFF; }
  .card { max-width: 78%; background: #FFF; border-radius: 20px; padding: 20px 22px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .card .w { font: 600 34px/1.1 Georgia, serif; margin: 0 0 4px; } .card .ipa { color: #8A867E; font-size: 15px; }
  .card p { margin: 10px 0 0; } .pos { font-style: italic; color: #6A665F; }
  .rates { display: flex; gap: 8px; margin-top: 16px; }
  .rates i { font-style: normal; padding: 7px 16px; border-radius: 999px; background: #F1EFEA; font-size: 15px; }
  .rates i.on { background: #1C1B19; color: #FFF; }
  .note { margin: 44px auto 0; width: 560px; background: rgba(255,255,255,.92); border-radius: 22px; padding: 18px 20px; box-shadow: 0 10px 40px rgba(0,0,0,.12); display: grid; grid-template-columns: 40px 1fr; gap: 4px 14px; }
  .note .av { grid-row: span 2; width: 40px; height: 40px; }
  .note b { font-weight: 600; } .note small { float: right; color: #8A867E; font-size: 13px; }
  .lock { height: 100%; background: linear-gradient(160deg, #2B3A55, #5A4B6E 60%, #8A6C7E); padding-top: 70px; text-align: center; color: #FFF; }
  .lock .clock { font: 300 88px/1 -apple-system, "Helvetica Neue", sans-serif; letter-spacing: -2px; } .lock .date { opacity: .85; margin-top: 6px; }
  .lock .note { text-align: left; color: #1C1B19; }
</style>
</head>
<body>
<script>
const s = new URLSearchParams(location.search).get('s') || 'quiz';
const bar = `<div class="top"><div class="av"></div><b>Muse</b><span>LexiAI review</span></div>`;
const def = 'Gradually destroy or be destroyed; to diminish or undermine something, often abstract concepts like trust, confidence, or support.';
const quiz = rated => `${bar}<div class="thread">
  <p class="time">Today 9:14 PM</p>
  <div class="m">8 words due tonight. Ready for your LexiAI review?</div>
  <div class="m me">Yes, go</div>
  <div class="card"><p class="w">erode</p><span class="ipa">/ɪˈroʊd/</span>
    <p><span class="pos">verb</span> — ${def}</p>
    <div class="rates">${['Again', 'Hard', 'Good', 'Easy'].map(r => `<i${rated && r === 'Good' ? ' class="on"' : ''}>${r}</i>`).join('')}</div></div>
  ${rated ? `<div class="m me">Good</div><div class="m">Saved to LexiAI. Next: <b>table stakes</b>.</div>` : ''}
</div>`;
document.body.innerHTML = s === 'note'
  ? `<div class="lock"><div class="clock">9:14</div><div class="date">Sunday, October 25</div>
     <div class="note"><div class="av"></div><div><b>Muse</b><small>now</small></div><div>8 words due tonight. Ready for your LexiAI review?</div></div></div>`
  : quiz(s === 'rated');
</script>
</body>
</html>
