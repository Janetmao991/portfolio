<svg class="desk" viewBox="0 0 720 680" role="img" aria-labelledby="desk-t">
<title id="desk-t">Drawing: Janet turned round in her desk chair, arms folded on its back, smiling at you; behind her the laptop looks up a word. Out of the window is the Golden Gate Bridge in the fog; on the wall her six projects are pinned to a board and tied together with string.</title>
