<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Direction A · Statement</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=zodiak@100,300&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEECE8;--ink:#1F1D1A;--soft:#5F5A52;--accent:#1F3A5F;--accent-ink:#F4F2EE}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 "Hanken Grotesk",sans-serif}
.hero{position:relative;height:100vh;padding:0 48px}
.top{position:absolute;top:40px;left:48px;right:48px;display:flex;align-items:baseline}
.top .mark{font:300 24px "Zodiak",serif}
.top nav{position:absolute;left:calc(42% - 48px);display:flex;gap:32px}
.top a{color:var(--ink);text-decoration:none}
.top .act{margin-left:auto}
h1{position:absolute;left:42%;right:48px;bottom:72px;margin:0;font:100 clamp(56px,7.4vw,112px)/.95 "Zodiak",serif;letter-spacing:-.035em}
.sub{position:absolute;left:48px;bottom:76px;width:30%;max-width:32ch;margin:0;color:var(--soft)}
.sub b{font-weight:500;color:var(--ink)}
.btn{display:inline-block;margin-top:20px;background:var(--accent);color:var(--accent-ink);padding:13px 22px;text-decoration:none;font-weight:500}
</style></head><body><section class="hero">
<div class="top"><span class="mark">Janet Mao</span><nav><a href="#">Work</a><a href="#">How it connects</a></nav><a class="act" href="#">About</a></div>
<p class="sub"><b>AI product builder, San Francisco.</b> Five tools for learning English as an adult, all writing back to one word list.<br><a class="btn" href="#">Look up a word</a></p>
<h1>One word list.<br>Five tools.</h1>
</section></body></html>
